#config_version=6
mode:
  start_events: city_win_start
  stop_events: timer_quit_city_win_time_complete, game_ended, ball_ended, game_ending, ball_ending
  restart_on_next_ball: false
  priority: 300

###########################

event_player:
  timer_quit_city_win_time_complete: twenties_start

###########################

show_player:
  mode_city_win_started:
    city_win_show:
      speed: 18
      loops: -1
      priority: 100
  mode_city_win_stopped:
    city_win_show:
      action: stop

###########################

slide_player:
  mode_city_win_started: city_win_slide

###########################

slides:
  city_win_slide: []

###########################

widgets:
  city_win_banner:
    type: text
    text: YOU FOUND ALL THE SECRETS !
    color: '006666'
    style: mission_text
    y: 35%
    x: 50%
    z: 100
    expire: 10s
    animations:
        add_to_slide:                   
        - property: opacity         
          value: 1                  
          duration: .5s             
        - property: opacity         
          value: 0
          duration: .5s
          repeat: true

  city_win_banner_2:
    type: text
    text: 17,500 points !
    color: '006666'
    style: mission_text
    y: 65%
    x: 50%
    z: 100
    expire: 10s
    animations:
        add_to_slide:                   
        - property: opacity         
          value: 1                  
          duration: .5s             
        - property: opacity         
          value: 0
          duration: .5s
          repeat: true  

  video_city_win_scratch_widget:
    type: video
    video: scratch_movie
    auto_play: True
    end_behavior: loop
    z: 2

###########################

widget_player:
  mode_city_win_started:
    city_win_banner, city_win_banner_2, video_city_win_scratch_widget, base_without_score_widget, superpops_widget, cthulhu_frame_image:
      action: add
      slide: city_win_slide

###########################

variable_player:
  mode_city_win_started:
    mission_city:
      action: set
      string: 'completed'

    score: 17500
    city_champion: 17500

    mission_boost_multiplier:
      action: add
      float: 0.1

###########################

timers:
  quit_city_win_time:
    start_value: 5
    end_value: 0
    direction: down
    tick_interval: 1s
    control_events:
      - action: start
        event: mode_city_win_started

###########################

sound_player:
  mode_city_win_started:
    evil_laugh_pool:
      action: play
      volume: 2
    super_jackpot_voice_pool:
      action: play
      volume: 2
      events_when_stopped: launch_city_win_voice
    dark_win_sound_pool:
      action: play
      volume: 1

  launch_city_win_voice:
    city_win_voice_pool:
      action: play
      volume: 2

###########################

sound_pools:
  city_win_voice_pool:
    load: on_demand
    type: random
    track: voice
    sounds:
      - city_fin_voice_1
      - city_fin_voice_2
      - city_fin_voice_3
      - city_fin_voice_4