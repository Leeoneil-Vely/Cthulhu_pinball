#config_version=6

mode:
  start_events: library_cthulhu_start
  stop_events: library_cthulhu_stop, timer_exit_library_cthulhu_time_complete, game_ended, ball_ended, game_ending, ball_ending
  priority: 2601
  restart_on_next_ball: false

###########################

event_player:
  mode_library_cthulhu_started: library_video_start
  base_gate_secret_library_exit_shot_hit: library_cthulhu_stop
  base_gate_exit_library_shot_hit: library_cthulhu_stop
  timer_exit_library_cthulhu_time_complete: launch_one_gong_sound

###########################

slides:
  library_cthulhu_slide: []

###########################

slide_player:
