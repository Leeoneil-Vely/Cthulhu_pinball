#config_version=6

mode:
  start_events: mini_wizard_twenties_intro_start
  stop_events: mini_wizard_twenties_complete, twenties_start
  priority: 4500
  game_mode: true
  restart_on_next_ball: false

###########################

event_player:
  mode_mini_wizard_twenties_started: twenties_stop, hold_stop, flipper_off, slingshot_off, stop_all_multiball, multiball_twenties_stop
  mode_mini_wizard_twenties_started{current_player.multiball_twenties_running=='true'}: stop_multiball_twenties
  ball_save_mini_wizard_twenties_intro_save_saving_ball: launch_mini_wizard_twenties
  timer_launch_mini_wizard_intro_time_complete: flipper_on, slingshot_on, mini_wizard_twenties_play_start
  "drop_target_mini_wizard_twenties_group_lit_complete{game.balls_in_play < 5}": add_buddy_wizard, reset_drop_targets, shaker_shake
  "drop_target_mini_wizard_twenties_group_lit_complete{game.balls_in_play >= 5}": reset_drop_targets, shaker_shake
  green_target_mini_wizard_twenties_group_lit_complete: add_wizard_time, shaker_shake
  square_target_mini_wizard_twenties_group_lit_complete: add_point_on_wizard_twenties, shaker_shake

  timer_stop_mini_wizard_twenties_time_complete: stop_mini_wizard_twenties
  timer_reset_mini_wizard_droptarget_time_complete: reset_drop_targets
  # "balls_in_play{value==0}": stop_mini_wizard_twenties
  # "{current_player.mission_wizard_twenties_multiplier_gauge==0}": show_multiplier_boost_0
  player_mission_wizard_twenties_multiplier_gauge{value==1}: show_multiplier_boost_2
  player_mission_wizard_twenties_multiplier_gauge{value==2}: show_multiplier_boost_4
  player_mission_wizard_twenties_multiplier_gauge{value==3}: show_multiplier_boost_6
  player_mission_wizard_twenties_multiplier_gauge{value==4}: show_multiplier_boost_8
  player_mission_wizard_twenties_multiplier_gauge{value>=5}: boost_wizard_twenties_multiplier, show_multiplier_boost_10
  show_multiplier_boost_10: show_multiplier_boost_0|3s


  launch_mini_wizard_twenties_indication_banner_8{current_player.mission_wizard_twenties_multiplier>=1 and current_player.mission_wizard_twenties_multiplier<1.49}: show_big_multiplier_10_frame_widget
  launch_mini_wizard_twenties_indication_banner_8{current_player.mission_wizard_twenties_multiplier>=1.49 and current_player.mission_wizard_twenties_multiplier<1.99}: show_big_multiplier_15_frame_widget
  launch_mini_wizard_twenties_indication_banner_8{current_player.mission_wizard_twenties_multiplier>=1.99 and current_player.mission_wizard_twenties_multiplier<2.49}: show_big_multiplier_20_frame_widget
  launch_mini_wizard_twenties_indication_banner_8{current_player.mission_wizard_twenties_multiplier>=2.49 and current_player.mission_wizard_twenties_multiplier<2.99}: show_big_multiplier_25_frame_widget
  launch_mini_wizard_twenties_indication_banner_8{current_player.mission_wizard_twenties_multiplier>=2.99 and current_player.mission_wizard_twenties_multiplier<3.49}: show_big_multiplier_30_frame_widget
  launch_mini_wizard_twenties_indication_banner_8{current_player.mission_wizard_twenties_multiplier>=3.49 and current_player.mission_wizard_twenties_multiplier<3.99}: show_big_multiplier_35_frame_widget
  launch_mini_wizard_twenties_indication_banner_8{current_player.mission_wizard_twenties_multiplier>=3.99}: show_big_multiplier_40_frame_widget
  player_mission_wizard_twenties_multiplier{value>=1 and value<1.49 and source=="mini_wizard_twenties"}: show_big_multiplier_10_frame_widget
  player_mission_wizard_twenties_multiplier{value>=1.49 and value<1.99 and source=="mini_wizard_twenties"}: show_big_multiplier_15_frame_widget
  player_mission_wizard_twenties_multiplier{value>=1.99 and value<2.49 and source=="mini_wizard_twenties"}: show_big_multiplier_20_frame_widget
  player_mission_wizard_twenties_multiplier{value>=2.49 and value<2.99 and source=="mini_wizard_twenties"}: show_big_multiplier_25_frame_widget
  player_mission_wizard_twenties_multiplier{value>=2.99 and value<3.49 and source=="mini_wizard_twenties"}: show_big_multiplier_30_frame_widget
  player_mission_wizard_twenties_multiplier{value>=3.49 and value<3.99 and source=="mini_wizard_twenties"}: show_big_multiplier_35_frame_widget
  player_mission_wizard_twenties_multiplier{value>=3.99 and source=="mini_wizard_twenties"}: show_big_multiplier_40_frame_widget

  mini_wizard_twenties_gate_library_shot_hit: library_start

###########################

# Ball save qui avale tous les drains sans relancer
ball_saves:
  mini_wizard_twenties_intro_save:
    active_time: 0
    hurry_up_time: 0
    grace_period: 0
    enable_events: mode_mini_wizard_twenties_started
    disable_events: mini_wizard_twenties_play_start
    auto_launch: false
    balls_to_save: 1

  mini_wizard_save:
    active_time: 30s
    hurry_up_time: 2s
    grace_period: 3s
    enable_events: mini_wizard_twenties_play_start, add_wizard_time
    disable_events: stop_mini_wizard_twenties
    auto_launch: true
    balls_to_save: -1

###########################

# Autolance la bille dès qu'elle entre dans le plunger lane pendant tout le mode
coil_player:
  balldevice_bd_plunger_lane_ball_entered:
    c_plunger:
      action: pulse

