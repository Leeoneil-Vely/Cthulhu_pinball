shot_profiles:
  mini_wizard_twenties_profile:
    advance_on_hit: true
    block: true
    loop: true
    states:
      - name: hit
        show: mini_wizard_twenties_target_blink_show
        speed: 4
        loops: 3
        priority: 4500

  mini_wizard_twenties_profile_2:
    advance_on_hit: true
    block: true
    loop: true
    states:
      - name: hit
        show: mini_wizard_twenties_target_blink_show
        speed: 4
        loops: 3
        priority: 4500

  mini_wizard_twenties_group_profile:
    advance_on_hit: true
    block: true
    loop: false
    states:
      - name: flashing
        show: mini_wizard_twenties_blink_show
        speed: 1
        loops: -1
        priority: 4500
      - name: lit
        show: mini_wizard_twenties_target_blink_show
        speed: 1
        loops: -1
        priority: 4500


######## profils pour loop et combos


  loop_wizard_twenties_profile:
    loop: false
    block: false
    states:      
      - name: activated
        show: base_nyarla_insert_flash_show
        speed: 100
