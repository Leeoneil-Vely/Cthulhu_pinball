###########################

timers:
  launch_mini_wizard_intro_time:
    start_value: 25
    end_value: 0
    direction: down
    tick_interval: 1s
    control_events:
      - action: start
        event: launch_mini_wizard_twenties

  reset_mini_wizard_droptarget_time:
    start_value: 30
    end_value: 0
    direction: down
    tick_interval: 1s
    control_events:
      - action: start
        event: mini_wizard_twenties_play_start
      - action: restart
        event: timer_reset_mini_wizard_droptarget_time_complete

  stop_mini_wizard_twenties_time:
    start_value: 284
    end_value: 0
    direction: down
    tick_interval: 1s
    control_events:
      - action: start
        event: launch_mini_wizard_twenties

######## timers pour combo et loop

  loop_mini_wizard_twenties_reset_time:
    start_value: 0
    end_value: 4
    direction: up
    tick_interval: 1s
    restart_on_complete: true
    control_events:
      - action: start
        event: mini_wizard_twenties_green_ramp_shot_hit
      - action: restart
        event: mini_wizard_twenties_green_ramp_loop_shot_activated_hit
      - action: stop
        event: timer_loop_mini_wizard_twenties_reset_time_complete

  space_loop_mini_wizard_twenties_reset_time:
    start_value: 0
    end_value: 4
    direction: up
    tick_interval: 1s
    restart_on_complete: true
    control_events:
      - action: start
        event: mini_wizard_twenties_space_orbit_shot_hit
      - action: restart
        event: mini_wizard_twenties_space_orbit_loop_shot_activated_hit
      - action: stop
        event: timer_space_loop_mini_wizard_twenties_reset_time_complete

  cthulhu_combo_mini_wizard_twenties_reset_time:
    start_value: 0
    end_value: 5
    direction: up
    tick_interval: 1s
    restart_on_complete: true
    control_events:
      - action: start
        event: mini_wizard_twenties_green_ramp_shot_hit
      - action: restart
        event: mini_wizard_twenties_green_ramp_shot_hit
      - action: restart
        event: mini_wizard_twenties_green_ramp_combo_shot_activated_hit
      - action: stop
        event: timer_cthulhu_combo_mini_wizard_twenties_reset_time_complete

  green_combo_mini_wizard_twenties_reset_time:
    start_value: 0
    end_value: 4
    direction: up
    tick_interval: 1s
    restart_on_complete: true
    control_events:
      - action: start
        event: mini_wizard_twenties_cthulhu_ramp_shot_hit
      - action: restart
        event: mini_wizard_twenties_cthulhu_ramp_combo_shot_activated_hit
      - action: stop
        event: timer_green_combo_mini_wizard_twenties_reset_time_complete

