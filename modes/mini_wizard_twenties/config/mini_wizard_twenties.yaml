multiballs:
  multiball_mini_wizard_twenties_multiball:
    ball_count: 1
    ball_count_type: add
    start_or_add_a_ball_events: add_buddy_wizard
    shoot_again: 0
    stop_events: stop_mini_wizard_twenties, mode_mini_wizard_twenties_ending_started

